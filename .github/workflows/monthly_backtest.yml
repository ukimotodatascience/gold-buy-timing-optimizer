name: Monthly Backtest

on:
  schedule:
    # JST 09:00 on the 1st day of each month (UTC 00:00)
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      train_end:
        description: "Train end date (YYYY-MM-DD). If omitted, use previous month end."
        required: false
      test_start:
        description: "Test start date (YYYY-MM-DD). If omitted, use previous month start."
        required: false
      test_end:
        description: "Test end date (YYYY-MM-DD). If omitted, use previous month end."
        required: false

jobs:
  run-monthly-backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn yfinance

      - name: Incremental data update
        run: python incremental_update_data.py

      - name: Resolve backtest date range
        id: range
        env:
          INPUT_TRAIN_END: ${{ github.event.inputs.train_end }}
          INPUT_TEST_START: ${{ github.event.inputs.test_start }}
          INPUT_TEST_END: ${{ github.event.inputs.test_end }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta

          def month_start(d: date) -> date:
              return d.replace(day=1)

          def prev_month_end(d: date) -> date:
              return month_start(d) - timedelta(days=1)

          today = date.today()
          prev_end = prev_month_end(today)
          prev_start = prev_end.replace(day=1)
          train_end_default = prev_start - timedelta(days=1)

          train_end = os.environ.get("INPUT_TRAIN_END") or train_end_default.isoformat()
          test_start = os.environ.get("INPUT_TEST_START") or prev_start.isoformat()
          test_end = os.environ.get("INPUT_TEST_END") or prev_end.isoformat()

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"train_end={train_end}\n")
              f.write(f"test_start={test_start}\n")
              f.write(f"test_end={test_end}\n")

          print(f"train_end={train_end}")
          print(f"test_start={test_start}")
          print(f"test_end={test_end}")
          PY

      - name: Run monthly backtest
        run: |
          python main.py \
            --mode monthly_backtest \
            --train-end "${{ steps.range.outputs.train_end }}" \
            --test-start "${{ steps.range.outputs.test_start }}" \
            --test-end "${{ steps.range.outputs.test_end }}" \
            --n-estimators 50

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monthly-backtest-${{ github.run_id }}
          path: |
            data/backtest/*.csv

      - name: Send monthly backtest summary to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRAIN_END: ${{ steps.range.outputs.train_end }}
          TEST_START: ${{ steps.range.outputs.test_start }}
          TEST_END: ${{ steps.range.outputs.test_end }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib import request
          from urllib.error import HTTPError, URLError

          import pandas as pd

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              print("DISCORD_WEBHOOK_URL is not set. Skip Discord notification.")
              raise SystemExit(0)

          base = Path("data/backtest")
          metrics_files = sorted(base.glob("*_metrics.csv"), key=lambda p: p.stat().st_mtime)
          cls_files = sorted(base.glob("*_classification_predictions.csv"), key=lambda p: p.stat().st_mtime)
          rank_files = sorted(base.glob("*_month_rank_regression_predictions.csv"), key=lambda p: p.stat().st_mtime)

          if not metrics_files or not cls_files or not rank_files:
              print("Backtest output files are missing. Skip Discord notification.")
              raise SystemExit(0)

          metrics_path = metrics_files[-1]
          cls_path = cls_files[-1]
          rank_path = rank_files[-1]

          metrics_df = pd.read_csv(metrics_path)
          cls_df = pd.read_csv(cls_path)
          rank_df = pd.read_csv(rank_path)

          n_days = len(cls_df)
          month_low_prob = (1.0 - cls_df["pred_prob_y_future_lower"]).astype(float)
          pred_rank = rank_df["pred_month_rank"].astype(float)

          avg_prob_month_low = float(month_low_prob.mean()) if n_days > 0 else float("nan")
          min_prob_month_low = float(month_low_prob.min()) if n_days > 0 else float("nan")
          max_prob_month_low = float(month_low_prob.max()) if n_days > 0 else float("nan")
          std_prob_month_low = float(month_low_prob.std(ddof=0)) if n_days > 0 else float("nan")

          avg_pred_rank = float(pred_rank.mean()) if len(pred_rank) > 0 else float("nan")
          min_pred_rank = float(pred_rank.min()) if len(pred_rank) > 0 else float("nan")
          max_pred_rank = float(pred_rank.max()) if len(pred_rank) > 0 else float("nan")
          std_pred_rank = float(pred_rank.std(ddof=0)) if len(pred_rank) > 0 else float("nan")

          reg = metrics_df[metrics_df["task"] == "regression_month_rank"]
          clf = metrics_df[metrics_df["task"] == "classification_month_low"]

          metric_lines = []
          if not reg.empty:
              metric_lines.append(
                  f"回帰: RMSE={float(reg.iloc[0]['rmse']):.4f}, MAE={float(reg.iloc[0]['mae']):.4f}"
              )
          if not clf.empty:
              acc = float(clf.iloc[0]["accuracy"])
              roc_auc = clf.iloc[0].get("roc_auc")
              if pd.notna(roc_auc):
                  metric_lines.append(f"分類: ACC={acc:.4f}, ROC-AUC={float(roc_auc):.4f}")
              else:
                  metric_lines.append(f"分類: ACC={acc:.4f}, ROC-AUC=NaN")

          content_lines = [
              "📊 **月次バックテスト結果**",
              f"対象期間: `{os.environ['TEST_START']}` 〜 `{os.environ['TEST_END']}`",
              f"学習終了日: `{os.environ['TRAIN_END']}`",
              "",
              "【サマリ】",
              f"- 評価日数: `{n_days}` 日",
              f"- 「今日が月内安値」確率: 平均 `{avg_prob_month_low:.2%}` / 最小 `{min_prob_month_low:.2%}` / 最大 `{max_prob_month_low:.2%}` / 標準偏差 `{std_prob_month_low:.2%}`",
              f"- 月内順位予測（1が最安）: 平均 `{avg_pred_rank:.2f}`位 / 最小 `{min_pred_rank:.2f}`位 / 最大 `{max_pred_rank:.2f}`位 / 標準偏差 `{std_pred_rank:.2f}`",
          ]
          if metric_lines:
              content_lines.extend([
                  "",
                  "【評価指標】",
                  f"- {' / '.join(metric_lines)}",
              ])

          payload = {"content": "\n".join(content_lines)}
          data = json.dumps(payload).encode("utf-8")
          req = request.Request(
              webhook,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with request.urlopen(req) as resp:
                  print(f"Discord webhook sent. status={resp.status}")
          except HTTPError as e:
              print(f"Warning: Discord webhook failed with HTTPError: {e.code} {e.reason}. Continue workflow.")
          except URLError as e:
              print(f"Warning: Discord webhook failed with URLError: {e.reason}. Continue workflow.")
          except Exception as e:
              print(f"Warning: Discord webhook failed with unexpected error: {e}. Continue workflow.")
          PY

      - name: Commit monthly backtest csv files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/*.csv data/close_prices.csv data/volumes.csv data/features.csv data/target.csv data/dataset_all.csv data/dataset_train.csv
          git diff --cached --quiet || git commit -m "chore: monthly backtest and data update"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
