name: Daily Data Update and Live Prediction

on:
  schedule:
    # JST 05:00 daily (UTC 20:00 previous day)
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  run-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn yfinance

      - name: Incremental data update
        run: python incremental_update_data.py

      - name: Compute asof/predict dates
        id: dates
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          from pathlib import Path

          all_path = Path("data/dataset_all.csv")
          all_df = pd.read_csv(all_path)
          all_df["Date"] = pd.to_datetime(all_df["Date"])
          priced_dates = all_df.loc[all_df["price"].notna(), "Date"]
          if priced_dates.empty:
              raise RuntimeError("No priced rows were found in dataset_all.csv")
          asof_date = priced_dates.max()
          predict_date = asof_date + pd.Timedelta(days=1)
          asof_date = asof_date.date()
          predict_date = predict_date.date()
          print(f"asof_date={asof_date}")
          print(f"predict_date={predict_date}")
          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as f:
              f.write(f"asof_date={asof_date}\n")
              f.write(f"predict_date={predict_date}\n")
          PY

      - name: Run live prediction
        run: |
          python main.py \
            --mode live \
            --asof-date "${{ steps.dates.outputs.asof_date }}" \
            --predict-date "${{ steps.dates.outputs.predict_date }}" \
            --n-estimators 50

      - name: Send live prediction summary to LINE
        env:
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ASOF_DATE: ${{ steps.dates.outputs.asof_date }}
          PREDICT_DATE: ${{ steps.dates.outputs.predict_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib import request
          from urllib.error import HTTPError, URLError

          import pandas as pd

          line_user_id = os.environ.get("LINE_USER_ID")
          line_token = os.environ.get("LINE_CHANNEL_ACCESS_TOKEN")
          if not line_user_id or not line_token:
              print("LINE_USER_ID or LINE_CHANNEL_ACCESS_TOKEN is not set. Skip LINE notification.")
              raise SystemExit(0)

          asof_date = os.environ["ASOF_DATE"]
          predict_date = os.environ["PREDICT_DATE"]
          base = Path("data/predictions_live")

          rank_path = base / f"live_{predict_date}_asof_{asof_date}_month_rank_regression_predictions.csv"
          cls_path = base / f"live_{predict_date}_asof_{asof_date}_classification_predictions.csv"

          if not rank_path.exists() or not cls_path.exists():
              print(f"Prediction files are missing. rank={rank_path.exists()} cls={cls_path.exists()}")
              raise SystemExit(0)

          rank_df = pd.read_csv(rank_path)
          cls_df = pd.read_csv(cls_path)

          rank_row = rank_df[rank_df["Date"] == predict_date]
          cls_row = cls_df[cls_df["Date"] == predict_date]
          if rank_row.empty:
              rank_row = rank_df.tail(1)
          if cls_row.empty:
              cls_row = cls_df.tail(1)

          rank_row = rank_row.iloc[-1]
          cls_row = cls_row.iloc[-1]

          pred_month_rank = float(rank_row.get("pred_month_rank", float("nan")))
          pred_prob_lower = float(cls_row.get("pred_prob_y_future_lower", float("nan")))
          pred_prob_month_low = float(cls_row.get("pred_prob_today_is_month_low", float("nan")))
          pred_cls = int(cls_row.get("pred_y_future_lower", 0))
          pred_cls_text = "この先さらに安い日が来そう" if pred_cls == 1 else "これ以上安い日は来にくそう"
          feature_date = cls_row.get("feature_date", rank_row.get("feature_date", asof_date))
          training_data_through = cls_row.get(
              "training_data_through",
              rank_row.get("training_data_through", asof_date),
          )
          feature_date = pd.to_datetime(feature_date).date().isoformat()
          training_data_through = pd.to_datetime(training_data_through).date().isoformat()

          if pred_prob_month_low >= 0.70:
              icon = "🟢"
              judgment = "買い優位（強）"
          elif pred_prob_month_low >= 0.45:
              icon = "🟡"
              judgment = "中立〜様子見"
          else:
              icon = "🔴"
              judgment = "買い非推奨"

          content_lines = [
              f"{icon} 金ETF 買いタイミング予測（日次）",
              f"予測対象日: {predict_date}",
              f"使用した特徴量の日付: {feature_date}",
              f"学習データの最新日: {training_data_through}",
              "",
              "【結論】",
              f"・今日が月内安値である確率: {pred_prob_month_low:.2%}",
              f"・分類予測: {pred_cls_text}",
              f"・判定: {judgment}",
              "",
              "【モデル出力】",
              f"・月内順位予測（1が最安）: {pred_month_rank:.2f}位",
              f"・この先さらに安い日が来る確率: {pred_prob_lower:.2%}",
          ]

          payload = {
              "to": line_user_id,
              "messages": [
                  {
                      "type": "text",
                      "text": "\n".join(content_lines),
                  }
              ],
          }
          data = json.dumps(payload).encode("utf-8")
          req = request.Request(
              "https://api.line.me/v2/bot/message/push",
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": f"Bearer {line_token}",
              },
              method="POST",
          )
          try:
              with request.urlopen(req) as resp:
                  print(f"LINE push message sent. status={resp.status}")
          except HTTPError as e:
              print(f"Warning: LINE push failed with HTTPError: {e.code} {e.reason}. Continue workflow.")
          except URLError as e:
              print(f"Warning: LINE push failed with URLError: {e.reason}. Continue workflow.")
          except Exception as e:
              print(f"Warning: LINE push failed with unexpected error: {e}. Continue workflow.")
          PY

      - name: Upload live artifacts
        uses: actions/upload-artifact@v4
        with:
          name: live-predictions-${{ github.run_id }}
          path: |
            data/predictions_live/*.csv
            data/dataset_train.csv
            data/features.csv
            data/target.csv

      - name: Commit updated data files
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/close_prices.csv data/volumes.csv data/features.csv data/target.csv data/dataset_all.csv data/dataset_train.csv
          git diff --cached --quiet || git commit -m "chore: daily incremental data update"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
